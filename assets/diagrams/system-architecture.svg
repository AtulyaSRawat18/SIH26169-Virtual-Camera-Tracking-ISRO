<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">SIH26169 modular virtual camera tracking architecture</title>
  <desc id="desc">Operational physics, camera, vision, estimation, control and gimbal loop with a separate ground-truth evaluation path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07101a"/><stop offset="1" stop-color="#101c2a"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#62e5c3"/></marker>
    <marker id="evalArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#7cb3ff"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#f5f7fb}.sub{font:15px Arial,sans-serif;fill:#9fb0c4}.tag{font:700 13px monospace;letter-spacing:2px;fill:#62e5c3}.box{fill:#111d2b;stroke:#33475d;stroke-width:2;rx:14}.main{font:700 18px Arial,sans-serif;fill:#f5f7fb}.small{font:14px Arial,sans-serif;fill:#a7b7ca}.optional{fill:#172237;stroke:#8a79ff;stroke-width:2;stroke-dasharray:7 5}.eval{fill:#0e2031;stroke:#5fa6ff;stroke-width:2}.arrow{stroke:#62e5c3;stroke-width:3;fill:none;marker-end:url(#arrow)}.evalLine{stroke:#7cb3ff;stroke-width:2.5;fill:none;stroke-dasharray:7 6;marker-end:url(#evalArrow)}
    </style>
  </defs>
  <rect width="1600" height="720" rx="24" fill="url(#bg)"/>
  <text x="60" y="58" class="tag">OPERATIONAL PATH</text>
  <text x="60" y="98" class="title">Modular coarse pointing, acquisition and tracking</text>
  <text x="60" y="126" class="sub">Every stage is replaceable; evaluation truth is isolated from camera steering.</text>

  <rect class="box" x="55" y="185" width="180" height="112"/>
  <text class="main" x="145" y="225" text-anchor="middle">Scenario physics</text>
  <text class="small" x="145" y="252" text-anchor="middle">CW / kinematics</text>
  <text class="small" x="145" y="276" text-anchor="middle">pose + velocity</text>

  <rect class="box" x="270" y="185" width="180" height="112"/>
  <text class="main" x="360" y="225" text-anchor="middle">Virtual camera</text>
  <text class="small" x="360" y="252" text-anchor="middle">pinhole projection</text>
  <text class="small" x="360" y="276" text-anchor="middle">noise + atmosphere</text>

  <rect class="box" x="485" y="185" width="180" height="112"/>
  <text class="main" x="575" y="225" text-anchor="middle">OpenCV</text>
  <text class="small" x="575" y="252" text-anchor="middle">beacon localization</text>
  <text class="small" x="575" y="276" text-anchor="middle">x, y + confidence</text>

  <rect class="optional" x="700" y="185" width="180" height="112" rx="14"/>
  <text class="main" x="790" y="225" text-anchor="middle">CNN correction</text>
  <text class="small" x="790" y="252" text-anchor="middle">optional experiment</text>
  <text class="small" x="790" y="276" text-anchor="middle">guarded fallback</text>

  <rect class="box" x="915" y="185" width="180" height="112"/>
  <text class="main" x="1005" y="225" text-anchor="middle">Estimator</text>
  <text class="small" x="1005" y="252" text-anchor="middle">KF / EKF / UKF</text>
  <text class="small" x="1005" y="276" text-anchor="middle">state + covariance</text>

  <rect class="optional" x="1130" y="185" width="180" height="112" rx="14"/>
  <text class="main" x="1220" y="225" text-anchor="middle">Predictor</text>
  <text class="small" x="1220" y="252" text-anchor="middle">none / CV / GRU / LSTM</text>
  <text class="small" x="1220" y="276" text-anchor="middle">future image point</text>

  <rect class="box" x="1345" y="185" width="180" height="112"/>
  <text class="main" x="1435" y="225" text-anchor="middle">PAT manager</text>
  <text class="small" x="1435" y="252" text-anchor="middle">track or search</text>
  <text class="small" x="1435" y="276" text-anchor="middle">LOCKED / LOST</text>

  <path class="arrow" d="M235 241 H270"/><path class="arrow" d="M450 241 H485"/><path class="arrow" d="M665 241 H700"/><path class="arrow" d="M880 241 H915"/><path class="arrow" d="M1095 241 H1130"/><path class="arrow" d="M1310 241 H1345"/>

  <rect class="box" x="1060" y="365" width="210" height="108"/>
  <text class="main" x="1165" y="405" text-anchor="middle">PID / FF-PID</text>
  <text class="small" x="1165" y="432" text-anchor="middle">pan + tilt demand</text>
  <text class="small" x="1165" y="456" text-anchor="middle">control limits</text>
  <rect class="box" x="730" y="365" width="235" height="108"/>
  <text class="main" x="848" y="405" text-anchor="middle">Constrained gimbal</text>
  <text class="small" x="848" y="432" text-anchor="middle">lag · rate · acceleration</text>
  <text class="small" x="848" y="456" text-anchor="middle">achieved attitude</text>
  <path class="arrow" d="M1435 297 V335 H1165 V365"/>
  <path class="arrow" d="M1060 419 H965"/>
  <path class="arrow" d="M730 419 H360 V297"/>
  <text class="tag" x="500" y="402">CAMERA FEEDBACK</text>

  <text x="60" y="550" class="tag" fill="#7cb3ff">EVALUATION-ONLY PATH</text>
  <rect class="eval" x="55" y="575" width="360" height="92" rx="14"/>
  <text class="main" x="235" y="613" text-anchor="middle">Hidden projection truth</text>
  <text class="small" x="235" y="641" text-anchor="middle">never supplied to detector or controller</text>
  <rect class="eval" x="505" y="575" width="390" height="92" rx="14"/>
  <text class="main" x="700" y="613" text-anchor="middle">Stage error + uncertainty</text>
  <text class="small" x="700" y="641" text-anchor="middle">RMSE · P95 · latency · lock · failures</text>
  <rect class="eval" x="985" y="575" width="540" height="92" rx="14"/>
  <text class="main" x="1255" y="613" text-anchor="middle">Evidence + optical consequence</text>
  <text class="small" x="1255" y="641" text-anchor="middle">paired A/B · Monte Carlo · replay · pointing loss · link margin</text>
  <path class="evalLine" d="M360 297 V530 H235 V575"/><path class="evalLine" d="M415 621 H505"/><path class="evalLine" d="M895 621 H985"/>
</svg>
